name: Build Mod

on:
  workflow_dispatch:
    inputs:
      build_fonts:
        description: 'Also rebuild the mod fonts (Cairo, FontSources/ -> Fonts/, .fontbundle and .ttf). Only needed after changing FontSources/'
        type: boolean
        default: false
      build_extra_fonts:
        description: 'Also build the extra fonts (ExtraFonts/FontSources/ -> ExtraFonts/Fonts/, not part of the mod)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Source/ArabicSupport.csproj

      # RimWorld 1.5 and 1.6 (Unity)  ->  1.6/Assemblies/ArabicSupport.dll
      - name: Build for RimWorld 1.5 / 1.6
        run: dotnet build Source/ArabicSupport.csproj -c Release --no-restore

      # RimWorld 1.7 (Waylith engine)  ->  1.7/Assemblies/ArabicSupport.dll
      - name: Build for RimWorld 1.7
        run: dotnet build Source/ArabicSupport.csproj -c Release17 --no-restore

      - name: Setup Python
        if: ${{ inputs.build_fonts || inputs.build_extra_fonts }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font tools
        if: ${{ inputs.build_fonts || inputs.build_extra_fonts }}
        run: pip install fonttools UnityPy ttfautohint-py

      # --ttf also writes each font as a plain .ttf next to its bundle: RimWorld 1.7 reads those directly.
      - name: Build mod fonts (FontSources/ -> Fonts/*.fontbundle and *.ttf)
        if: ${{ inputs.build_fonts }}
        run: python Tools/build_fonts.py --ttf

      - name: Build extra fonts (ExtraFonts/FontSources/ -> ExtraFonts/Fonts/*.fontbundle)
        if: ${{ inputs.build_extra_fonts }}
        run: python Tools/build_fonts.py --extra

      # The finished mod folder, ready to copy into RimWorld/Mods (or to upload to the Workshop).
      - name: Assemble the mod folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'ModPackage/ArabicSupport'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Copy-Item -Recurse -Path 'About', 'Fonts' -Destination $dest
          Copy-Item -Path 'LoadFolders.xml', 'LICENSE' -Destination $dest

          New-Item -ItemType Directory -Force -Path "$dest/FontSources" | Out-Null
          Copy-Item -Recurse -Path 'FontSources/Licenses' -Destination "$dest/FontSources"

          foreach ($version in '1.6', '1.7') {
            New-Item -ItemType Directory -Force -Path "$dest/$version/Assemblies" | Out-Null
            Copy-Item -Path "$version/Assemblies/ArabicSupport.dll" -Destination "$dest/$version/Assemblies"
          }

          Get-ChildItem -Recurse $dest | Where-Object { -not $_.PSIsContainer } | ForEach-Object { $_.FullName.Substring((Resolve-Path $dest).Path.Length + 1) }

      - name: Upload the mod folder as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArabicSupport-mod
          path: ModPackage

      - name: Upload compiled DLLs as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArabicSupport-dll
          path: |
            1.6/Assemblies/ArabicSupport.dll
            1.7/Assemblies/ArabicSupport.dll

      - name: Upload mod fonts as artifact
        if: ${{ inputs.build_fonts }}
        uses: actions/upload-artifact@v7
        with:
          name: ArabicSupport-fonts
          path: |
            Fonts/*.fontbundle
            Fonts/*.ttf

      - name: Upload extra fonts as artifact
        if: ${{ inputs.build_extra_fonts }}
        uses: actions/upload-artifact@v7
        with:
          name: ArabicSupport-extra-fonts
          path: ExtraFonts/Fonts/*.fontbundle
